<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC — Verificación de Identidad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0c0f;
    --surface:  #111418;
    --border:   #1e2228;
    --border2:  #2a3040;
    --accent:   #2563eb;
    --accent2:  #1d4ed8;
    --success:  #16a34a;
    --error:    #dc2626;
    --text1:    #f0f2f5;
    --text2:    #8b95a6;
    --text3:    #4a5568;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  /* header */
  .header {
    width: 100%;
    max-width: 560px;
    margin-bottom: 48px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .logo-mark {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 16px; height: 16px; }
  .logo-text {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.08em;
  }
  h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text1);
    line-height: 1.2;
    margin-bottom: 10px;
  }
  h1 span { color: var(--accent); font-weight: 500; }
  .subtitle {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }

  /* card */
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 16px;
  }

  /* step indicator */
  .steps {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }
  .step-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border2);
    transition: all .3s;
  }
  .step-dot.active { background: var(--accent); width: 20px; border-radius: 3px; }
  .step-dot.done   { background: var(--success); }

  /* upload zones */
  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .upload-zone {
    border: 1.5px dashed var(--border2);
    border-radius: 12px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    background: transparent;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(37,99,235,.04); }
  .upload-zone.has-file { border-style: solid; border-color: var(--success); background: rgba(22,163,74,.05); }
  .upload-zone.dragover { border-color: var(--accent); background: rgba(37,99,235,.08); transform: scale(1.01); }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .zone-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    transition: background .2s;
  }
  .upload-zone.has-file .zone-icon { background: rgba(22,163,74,.15); }
  .zone-icon svg { width: 18px; height: 18px; }
  .zone-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text1);
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .zone-hint {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--mono);
  }
  .zone-filename {
    font-size: 11px;
    color: var(--success);
    font-family: var(--mono);
    margin-top: 6px;
    word-break: break-all;
    display: none;
  }
  .upload-zone.has-file .zone-filename { display: block; }
  .upload-zone.has-file .zone-hint { display: none; }

  /* preview thumbnails */
  .preview-img {
    width: 56px; height: 40px;
    object-fit: cover;
    border-radius: 6px;
    margin: 8px auto 0;
    display: none;
    border: 1px solid var(--border2);
  }
  .upload-zone.has-file .preview-img { display: block; }

  /* separador */
  .separator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .sep-line { flex: 1; height: 1px; background: var(--border); }
  .sep-text { font-size: 11px; color: var(--text3); font-family: var(--mono); letter-spacing: 0.06em; }

  /* nombre del solicitante */
  .field-group { margin-bottom: 24px; }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .field-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text1);
    font-family: var(--sans);
    outline: none;
    transition: border-color .2s;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-input::placeholder { color: var(--text3); }

  /* submit */
  .btn-submit {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--sans);
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover:not(:disabled) { background: var(--accent2); transform: translateY(-1px); }
  .btn-submit:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-submit .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* resultado */
  .result {
    width: 100%;
    max-width: 560px;
    border-radius: 12px;
    padding: 20px 24px;
    display: none;
    animation: fadeUp .3s ease;
  }
  .result.success { background: rgba(22,163,74,.08); border: 1px solid rgba(22,163,74,.25); }
  .result.error   { background: rgba(220,38,38,.08);  border: 1px solid rgba(220,38,38,.25); }
  .result-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .result.success .result-title { color: #4ade80; }
  .result.error   .result-title { color: #f87171; }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
    font-size: 12px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-key   { color: var(--text2); }
  .result-value { font-family: var(--mono); color: var(--text1); font-size: 11px; }

  /* historial */
  .history-card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 32px;
    margin-top: 16px;
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .history-title { font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: 0.04em; }
  .history-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: rgba(37,99,235,.1);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    animation: fadeUp .2s ease;
  }
  .history-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
  }
  .history-id { color: var(--text1); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .new-btn {
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    font-family: var(--sans);
    color: var(--text2);
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    transition: all .2s;
  }
  .new-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
        <rect x="2" y="3" width="12" height="8" rx="1.5"/>
        <circle cx="5.5" cy="7" r="1.5"/>
        <line x1="8.5" y1="5.5" x2="12" y2="5.5"/>
        <line x1="8.5" y1="8.5" x2="12" y2="8.5"/>
      </svg>
    </div>
    <span class="logo-text">KYC · ONBOARDING DIGITAL</span>
  </div>
  <h1>Verificación de <span>identidad</span></h1>
  <p class="subtitle">Sube la cédula y selfie del solicitante para iniciar el proceso de verificación automatizada.</p>
</div>

<div class="card">
  <div class="steps">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <div class="field-group">
    <label class="field-label">NOMBRE DEL SOLICITANTE (opcional)</label>
    <input type="text" class="field-input" id="nombre" placeholder="Ej. Juan Pérez">
  </div>

  <div class="separator">
    <div class="sep-line"></div>
    <span class="sep-text">DOCUMENTOS</span>
    <div class="sep-line"></div>
  </div>

  <div class="upload-grid">
    <div class="upload-zone" id="zone-cedula" ondragover="onDrag(event,'zone-cedula')" ondragleave="offDrag('zone-cedula')" ondrop="onDrop(event,'cedula')">
      <input type="file" id="input-cedula" accept=".png,.jpg,.jpeg,.webp" onchange="onFile(this,'cedula')">
      <div class="zone-icon">
        <svg viewBox="0 0 18 18" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round">
          <rect x="1.5" y="3" width="15" height="10.5" rx="1.5"/>
          <circle cx="5.5" cy="8.25" r="1.75"/>
          <line x1="8.5" y1="6.75" x2="14" y2="6.75"/>
          <line x1="8.5" y1="9.75" x2="14" y2="9.75"/>
        </svg>
      </div>
      <div class="zone-label">Cédula</div>
      <div class="zone-hint">PNG / JPG / WEBP</div>
      <div class="zone-filename" id="name-cedula"></div>
      <img class="preview-img" id="prev-cedula" alt="">
    </div>

    <div class="upload-zone" id="zone-selfie" ondragover="onDrag(event,'zone-selfie')" ondragleave="offDrag('zone-selfie')" ondrop="onDrop(event,'selfie')">
      <input type="file" id="input-selfie" accept=".png,.jpg,.jpeg,.webp" onchange="onFile(this,'selfie')">
      <div class="zone-icon">
        <svg viewBox="0 0 18 18" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round">
          <circle cx="9" cy="7.5" r="3"/>
          <path d="M2 15c0-3.314 3.134-6 7-6s7 2.686 7 6"/>
        </svg>
      </div>
      <div class="zone-label">Selfie</div>
      <div class="zone-hint">PNG / JPG / WEBP</div>
      <div class="zone-filename" id="name-selfie"></div>
      <img class="preview-img" id="prev-selfie" alt="">
    </div>
  </div>

  <button class="btn-submit" id="btn" onclick="enviar()" disabled>
    <span class="spinner"></span>
    <span class="btn-text">Procesar solicitud →</span>
  </button>
</div>

<div class="result" id="result"></div>

<div class="history-card" id="history-card" style="display:none">
  <div class="history-header">
    <span class="history-title">SOLICITUDES REGISTRADAS</span>
    <span class="history-count" id="history-count">0</span>
  </div>
  <div class="history-list" id="history-list"></div>
  <button class="new-btn" onclick="resetForm()">+ Nueva solicitud</button>
</div>

<script>
  const files = { cedula: null, selfie: null };

  function onFile(input, tipo) {
    const file = input.files[0];
    if (!file) return;
    files[tipo] = file;
    const zone = document.getElementById(`zone-${tipo}`);
    zone.classList.add("has-file");
    document.getElementById(`name-${tipo}`).textContent = file.name;
    const prev = document.getElementById(`prev-${tipo}`);
    prev.src = URL.createObjectURL(file);
    updateDots();
    checkBtn();
  }

  function onDrag(e, id) {
    e.preventDefault();
    document.getElementById(id).classList.add("dragover");
  }
  function offDrag(id) {
    document.getElementById(id).classList.remove("dragover");
  }
  function onDrop(e, tipo) {
    e.preventDefault();
    offDrag(`zone-${tipo}`);
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const input = document.getElementById(`input-${tipo}`);
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    onFile(input, tipo);
  }

  function checkBtn() {
    document.getElementById("btn").disabled = !(files.cedula && files.selfie);
  }

  function updateDots() {
    const d1 = document.getElementById("dot1");
    const d2 = document.getElementById("dot2");
    const d3 = document.getElementById("dot3");
    const hasCedula = !!files.cedula;
    const hasSelfie = !!files.selfie;
    d1.className = "step-dot " + (hasCedula || hasSelfie ? "done" : "active");
    d2.className = "step-dot " + (hasCedula && hasSelfie ? "done" : hasCedula || hasSelfie ? "active" : "");
    d3.className = "step-dot " + (hasCedula && hasSelfie ? "active" : "");
  }

  async function enviar() {
    const btn = document.getElementById("btn");
    btn.disabled = true;
    btn.classList.add("loading");

    const form = new FormData();
    form.append("cedula", files.cedula);
    form.append("selfie", files.selfie);

    try {
      const res  = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json();
      mostrarResultado(data);
      if (data.ok) cargarHistorial();
    } catch (e) {
      mostrarResultado({ ok: false, error: "Error de conexión con el servidor." });
    } finally {
      btn.classList.remove("loading");
    }
  }

  function mostrarResultado(data) {
    const el = document.getElementById("result");
    if (data.ok) {
      el.className = "result success";
      el.innerHTML = `
        <div class="result-title">✓ Solicitud registrada correctamente</div>
        <div class="result-row"><span class="result-key">ID de solicitud</span><span class="result-value">${data.solicitud_id}</span></div>
        <div class="result-row"><span class="result-key">Documento</span><span class="result-value">${data.doc}</span></div>
        <div class="result-row"><span class="result-key">Selfie</span><span class="result-value">${data.selfie}</span></div>
        <div class="result-row"><span class="result-key">Estado</span><span class="result-value" style="color:#4ade80">pendiente de verificación</span></div>
      `;
    } else {
      el.className = "result error";
      el.innerHTML = `<div class="result-title">✗ Error</div><div style="font-size:13px;color:var(--text2)">${data.error}</div>`;
    }
    el.style.display = "block";
  }

  async function cargarHistorial() {
    const res  = await fetch("/solicitudes");
    const data = await res.json();
    const hc   = document.getElementById("history-card");
    const hl   = document.getElementById("history-list");
    const cnt  = document.getElementById("history-count");

    hc.style.display = "block";
    cnt.textContent  = data.total;
    hl.innerHTML = data.ids.map(id => `
      <div class="history-item">
        <div class="history-dot"></div>
        <span class="history-id">onb_sol_${id}</span>
        <span style="margin-left:auto;color:var(--text3)">doc + selfie</span>
      </div>
    `).join("");
  }

  function resetForm() {
    files.cedula = null;
    files.selfie = null;
    ["cedula","selfie"].forEach(t => {
      document.getElementById(`zone-${t}`).classList.remove("has-file");
      document.getElementById(`name-${t}`).textContent = "";
      document.getElementById(`prev-${t}`).src = "";
      document.getElementById(`input-${t}`).value = "";
    });
    document.getElementById("nombre").value = "";
    document.getElementById("result").style.display = "none";
    updateDots();
    checkBtn();
    document.getElementById("dot1").className = "step-dot active";
  }

  cargarHistorial();
</script>
</body>
</html>
